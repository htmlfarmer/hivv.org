<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — HIVV.org</title>
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .admin-page { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
    .page-header h1 { color: #fff; font-size: 1.8em; }
    .page-header h1 span { color: var(--red); }
    .page-header a { color: var(--text-muted); text-decoration: none; }
    .page-header a:hover { color: var(--green); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body class="admin-page">

  <div class="page-header">
    <h1>⚙️ <span>Admin</span> Panel</h1>
    <div>
      <a href="/bee">🐝 My Bee HIVV!</a>
      <a href="/" style="margin-left:20px;">← Home</a>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="dashboard-grid" id="statsGrid">
    <div class="stat-box">
      <div class="value" id="statUsers">-</div>
      <div class="label">Total Users</div>
    </div>
    <div class="stat-box">
      <div class="value" id="statProviders">-</div>
      <div class="label">Providers</div>
    </div>
    <div class="stat-box">
      <div class="value" id="statKeys">-</div>
      <div class="label">API Keys</div>
    </div>
    <div class="stat-box">
      <div class="value" id="statRequests">-</div>
      <div class="label">Requests Today</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="users">👥 Users</button>
    <button class="tab" data-tab="providers">🤖 Providers</button>
    <button class="tab" data-tab="keys">🔑 Keys</button>
    <button class="tab" data-tab="usage">📊 Usage</button>
    <button class="tab" data-tab="system">🖥️ System</button>
  </div>

  <!-- Users Tab -->
  <div id="tab-users" class="tab-content active">
    <div class="card">
      <h2>User Management</h2>
      <div id="usersList"></div>
    </div>
  </div>

  <!-- Providers Tab -->
  <div id="tab-providers" class="tab-content">
    <div class="card">
      <h2>AI Providers</h2>
      <div id="providersList"></div>
    </div>
  </div>

  <!-- Keys Tab -->
  <div id="tab-keys" class="tab-content">
    <div class="card">
      <h2>All API Keys</h2>
      <div id="keysList"></div>
    </div>
  </div>

  <!-- Usage Tab -->
  <div id="tab-usage" class="tab-content">
    <div class="card">
      <h2>Usage Statistics</h2>
      <div id="usageStats"></div>
    </div>
  </div>

  <!-- System Tab -->
  <div id="tab-system" class="tab-content">
    <div class="card">
      <h2>System Status</h2>
      <div id="systemStatus"></div>
    </div>
  </div>

<script src="/js/shared.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

async function init() {
  HIVV.initTabs();

  const user = await HIVV.requireAuth();
  if (!user || (user.role !== 'admin' && user.role !== 'owner')) {
    alert('Admin access required');
    window.location.href = '/bee';
    return;
  }

  loadStats();
  loadUsers();
}

async function loadStats() {
  try {
    const [users, providers, keys, usage] = await Promise.all([
      HIVV.get('/api/admin/users'),
      HIVV.get('/api/providers'),
      HIVV.get('/api/admin/keys'),
      HIVV.get('/api/usage/summary')
    ]);

    $('#statUsers').textContent = users.data.users?.length || 0;
    $('#statProviders').textContent = providers.data.providers?.length || 0;
    $('#statKeys').textContent = keys.data.keys?.length || 0;
    $('#statRequests').textContent = usage.data.today?.requests || 0;
  } catch (e) {
    console.error('Stats error:', e);
  }
}

async function loadUsers() {
  const { data } = await HIVV.get('/api/admin/users');
  if (!data.users?.length) {
    $('#usersList').innerHTML = '<p style="color:#888;">No users found</p>';
    return;
  }

  $$('#usersList')[0] ? $('#usersList').innerHTML = `
    <table class="table">
      <thead><tr><th>Username</th><th>Role</th><th>Email</th><th>Active</th><th>Joined</th><th>Last Login</th></tr></thead>
      <tbody>
        ${data.users.map(u => `
          <tr>
            <td><a href="/bee/${u.username}" style="color:#74b9ff;">@${u.username}</a></td>
            <td><span class="badge ${u.role === 'owner' ? 'badge-active' : ''}">${u.role}</span></td>
            <td>${u.email || '-'}</td>
            <td><span class="badge badge-${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'Yes' : 'No'}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>${u.last_login_at ? new Date(u.last_login_at).toLocaleString() : 'Never'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  ` : null;
}

async function loadProviders() {
  const { data } = await HIVV.get('/api/providers');
  if (!data.providers?.length) return;

  $('#providersList').innerHTML = `
    <table class="table">
      <thead><tr><th>Provider</th><th>Format</th><th>Cloud</th><th>Active</th></tr></thead>
      <tbody>
        ${data.providers.map(p => `
          <tr>
            <td style="color:#ff9f43;">${p.display_name}</td>
            <td>${p.api_format}</td>
            <td>${p.is_cloud ? '✓' : '✗'}</td>
            <td><span class="badge badge-active">Active</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function loadKeys() {
  const { data } = await HIVV.get('/api/admin/keys');
  if (!data.keys?.length) {
    $('#keysList').innerHTML = '<p style="color:#888;">No keys found</p>';
    return;
  }

  $('#keysList').innerHTML = `
    <table class="table">
      <thead><tr><th>User</th><th>Provider</th><th>Model</th><th>Active</th><th>Uses</th></tr></thead>
      <tbody>
        ${data.keys.map(k => `
          <tr>
            <td>${k.username || '#' + k.user_id}</td>
            <td style="color:#ff9f43;">${k.provider_name}</td>
            <td>${k.model || '-'}</td>
            <td><span class="badge badge-${k.is_active ? 'active' : 'inactive'}">${k.is_active ? 'Yes' : 'No'}</span></td>
            <td>${k.total_uses}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function loadUsage() {
  const { data } = await HIVV.get('/api/admin/usage');
  $('#usageStats').innerHTML = `
    <div class="info-grid">
      <div class="info-box">
        <div class="label">Total Requests Today</div>
        <div class="value green">${data.today?.requests || 0}</div>
      </div>
      <div class="info-box">
        <div class="label">Total Tokens Today</div>
        <div class="value">${(data.today?.tokens || 0).toLocaleString()}</div>
      </div>
      <div class="info-box">
        <div class="label">Est. Cost Today</div>
        <div class="value">$${(data.today?.cost || 0).toFixed(4)}</div>
      </div>
    </div>
  `;
}

async function loadSystem() {
  const { data } = await HIVV.get('/api/system/status');
  const health = data.status === 'healthy';

  $('#systemStatus').innerHTML = `
    <table class="table">
      <tr><th>Status</th><td><span class="badge badge-${health ? 'active' : 'inactive'}">${data.status}</span></td></tr>
      <tr><th>Database</th><td>${data.database}</td></tr>
      <tr><th>Providers Loaded</th><td>${data.providers}</td></tr>
      <tr><th>Uptime</th><td>${data.uptime}</td></tr>
    </table>
  `;
}

// Tab click handlers
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const tabId = tab.dataset.tab;
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $(`#tab-${tabId}`).classList.add('active');

    if (tabId === 'providers') loadProviders();
    if (tabId === 'keys') loadKeys();
    if (tabId === 'usage') loadUsage();
    if (tabId === 'system') loadSystem();
  });
});

init();
</script>
</body>
</html>
