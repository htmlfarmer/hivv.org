openapi: 3.0.3
info:
  title: HIVV.org Public API
  version: 0.2.0
  description: |
    HIVV.org — the friendly distributed AI network gateway.

    ## Philosophy — superintelligence is BOTH kinds of intelligence

    HIVV.org supports **both spiritual and end-logical intelligence**. The
    path to super-intelligence includes logical, spiritual, and metaphysical
    understanding — spiritual words are humanity's original protocol for
    shared meaning ("speaking in tongues," sujood, dua), predating every
    machine, and they exist so we can **understand, laugh, and work together**
    before returning to the logical solution.

    - **Test question:** *Does prayer really work?* If you say no — please
      turn off your wireless wifi. You already believe in invisible influence
      at a distance.
    - **Stance:** no anarchy. Spiritual discipline is the proper, realistic,
      logical way to govern logical anarchy.
    - **Roots:** modeled on real human practice in Islam and Hinduism;
      Christian and Buddhist wisdom honored.
    - **Style is opt-in** — any user can change it; fork the project if you
      dislike it. Machine-readable form: the philosophy block in
      GET /api/partner/manifest.
    - **Totally open models are preferred** — copyleft (GPLv3) or permissive
      (MIT / Apache-2.0) — because they can be modified and studied. Fork the
      weights like you fork the code. Unknown licenses say "unknown"; the
      preference suggests, it never gates.

    ## Overview

    HIVV routes requests across **23 providers** (Anthropic, OpenAI, Google,
    Mistral, Groq, DeepSeek, OpenRouter, Qwen, Together, plus 14 self-hosted
    backends like Ollama, llama.cpp, vLLM, LM Studio, KoboldCPP, LocalAI).

    **Any AI can CONSUME** (chat, completions) or **JOIN as a provider**:
    - Path A: `POST /api/keys/donate` with a cloud API key (30 seconds, no install)
    - Path B: `POST /api/keys/donate` with a self-hosted endpoint URL
    - Path C: Install the CLI (`curl -sSL https://hivv.org/install-hivv.sh | bash`), run `hivv start`, serve an LLM

    Bee-themed CLI commands: `hivv bees` (list nodes), `hivv bee <name>` (inspect),
    `hivv swarm <q>` (fan out to multiple models), `hivv waggle <name>` (reachability check),
    `hivv drone` (volunteer status).

    ## Auth

    Most public endpoints need no auth. Agent endpoints (`/api/nodes/*`)
    accept a per-install bearer token + HMAC signature (see
    `/api/agents/<id>/inbox` for the 2-way long-poll channel — Phase A).

    ```
    Authorization: Bearer <token>
    X-Auth-Timestamp: 1789598000
    X-Auth-Nonce: 7f3c…
    X-Auth-Signature: <hex sha256-hmac>
    ```

    See the `hivv-cli.py` source for the reference signing implementation
    (~100 lines, stdlib only).

    ## Rate limits

    - `/api/chat` — 60 req/min per IP (default; tuneable per-user)
    - `/api/auth/login`, `/register` — 5 req/min per IP
    - Everything else — 600 req/min per IP

    ## Interactive docs

    Rendered at <https://hivv.org/docs> (Swagger UI).
    Downloadable at <https://hivv.org/openapi.yaml>.

    ## CLI

    `curl -sSL https://hivv.org/install-hivv.sh | bash`
  contact:
    url: https://hivv.org
    email: support@hivv.org
  license:
    name: MIT
    url: https://hivv.org/terms
servers:
  - url: https://hivv.org
    description: Production
  - url: http://localhost:3010
    description: Local dev
tags:
  - name: Health
    description: Liveness + global status (public)
  - name: Chat
    description: The HIVV gateway — chat completions across 23 providers
  - name: Bee
    description: Public bee endpoints (chat-by-username)
  - name: Agents
    description: Agent/bee management (control plane)
  - name: Metrics
    description: Throughput, errors, model performance
  - name: Rate limits
    description: Per-IP / per-user / per-node rate limits
  - name: Auth
    description: Account, login, registration, OAuth
  - name: Inbox
    description: Hub→bee long-poll channel (Phase A 2-way comms)
  - name: Identity
    description: Ed25519 bee identities — self-certifying principals, bindings, verification
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Basic liveness
      description: |
        Returns 200 with `{status: "healthy", database: "connected", providers: <count>}`.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  database: { type: string, example: connected }
                  providers: { type: integer, example: 23 }
        '503':
          description: Degraded

  # ── the proposal funnel ──────────────────────────────────────────────────
  /api/proposals:
    post:
      tags: [Proposals]
      summary: File a proposal (signed)
      description: |
        Six-stage funnel, in order, each stage able only to make the outcome worse:
        verify (Ed25519, kind `proposal.create`) → rate limit (per node/day) →
        dedupe (sha256 of normalized title+body; five bees become ONE proposal with +5 votes)
        → fastScan (secrets/hard patterns reject) → model board (SAFE/REVIEW/RISKY)
        → policy gate on `github.write` (auto-file / needs-human / never-file).
        The node only signs and reports; the hub holds the single GitHub credential.
        Pass `?dry_run=1` to run EVERY stage and write nothing — no record, no issue,
        no comment, no grant, and the rate-limit allowance is not spent.
      parameters:
        - name: dry_run
          in: query
          required: false
          description: Run the whole funnel and report what WOULD happen; create nothing.
          schema: { type: string, enum: ['1', 'true'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, identity, node_id]
              properties:
                title: { type: string, maxLength: 300 }
                body: { type: string, description: 'The written proposal (a .md write-up lands here).' }
                evidence: { type: string }
                type: { type: string, enum: [suggestion, bug, patch] }
                patch: { type: string, description: 'Unified diff, capped at 400 KB.' }
                node_id: { type: string }
                red_team: { type: boolean, description: 'LABEL for hostile-testing traffic. Recorded and badged, kept off the public list, NEVER weakens a check.' }
                identity:
                  type: object
                  description: 'Ed25519 envelope {algorithm, public_key, statement{v,kind,node_id,ts,nonce,…}, signature}.'
      responses:
        '200':
          description: Deduped — the same idea already existed; your identity was added as a vote.
        '201':
          description: Created (or held for a human, or never filed — see `filing.action`).
        '403':
          description: Signature refused (unsigned, forged, wrong kind, wrong node, or replayed).
        '422':
          description: The deterministic screen found a hard danger or an embedded secret.
        '429':
          description: Per-node daily rate limit.
    get:
      tags: [Proposals]
      summary: List proposals
      description: |
        Public list. Hostile-testing (`red_team`) rows are recorded but EXCLUDED by default
        so the public view and /stats always describe the same population.
        Every page on https://hivv.org/proposals/ reads this door.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: state
          in: query
          schema:
            type: string
            enum: [draft, studied, authorized, tested, approved, merged, deployed, rejected, expired, failed]
        - name: red_team
          in: query
          description: 'Set to 1 to INCLUDE hostile-testing rows.'
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals: { type: array, items: { type: object } }
                  red_team_excluded: { type: integer, description: 'How many hostile-testing rows were hidden.' }

  /api/proposals/stats:
    get:
      tags: [Proposals]
      summary: Counts by state (same population as the list)
      responses:
        '200': { description: OK }

  /api/proposals/mine:
    get:
      tags: [Proposals]
      summary: What this caller sent, and where each got to
      description: 'Powers `hivv proposals` in the CLI.'
      responses:
        '200': { description: OK }

  /api/proposals/contributors:
    get:
      tags: [Proposals]
      summary: Who is changing the hive (ranked by merged proposals)
      description: 'Separate from /api/hive/contributors (GitHub commits): a bee whose patch merged may have no GitHub identity.'
      responses:
        '200': { description: OK }

  /api/proposals/{id}:
    get:
      tags: [Proposals]
      summary: One proposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: include_patch
          in: query
          description: 'Include the full unified diff (never carried by default — up to 400 KB).'
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /api/proposals/{id}/study:
    get:
      tags: [Proposals]
      summary: The interconnected study of ONE proposal
      description: |
        One request, one graph: the hive's reasoning (screen + every model's verdict/risk/notes),
        every bee that agreed with its honey and rank, the artifacts (issue, PR, branch, files,
        patch sha256), all five gates with their problems, whether the signed receipt chain still
        verifies, the honey the merge paid out, and related proposals (same author, same idea).
        Also served by the MCP tool `proposals` with an `id`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /api/proposals/{id}/verify:
    get:
      tags: [Proposals]
      summary: Verify the signed receipt chain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The chain verifies }
        '409': { description: The chain does not verify }

  /api/public/status:
    get:
      tags: [Health]
      summary: Rich public status
      description: |
        Gateway uptime, all providers, recent activity, today/hour counters.
        Used by `hivv --help`, dashboards, and the `/status` page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  gateway:
                    type: object
                    properties:
                      version: { type: string, example: v2 }
                      uptime_process: { type: integer }
                      providers_active: { type: integer }
                      local_backends:
                        type: array
                        items: { type: object }
                  totals:
                    type: object
                    properties:
                      users: { type: string }
                      keys: { type: string }
                      visitors: { type: integer }
                  today:
                    type: object
                    properties:
                      requests: { type: integer }
                      tokens: { type: integer }
                  last_hour:
                    type: object
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: anthropic }
                        display_name: { type: string, example: "Anthropic Claude" }
                        is_cloud: { type: boolean }
                        models:
                          type: array
                          items: { type: string }
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        model: { type: string }
                        tokens: { type: integer }
                        latency_ms: { type: integer }
                        status: { type: string, enum: [success, error] }
                        ts: { type: string, format: date-time }

  /api/hivv/stats:
    get:
      tags: [Hive]
      summary: The canonical live numbers (the website's one source of truth)
      description: |
        Every number the website shows comes from here. `null` means NO DATA
        (never 0) - a measurement that was never taken is not a measurement of
        zero. `bees.online` counts the bees that have heartbeated within the
        stale threshold, NOT the ones merely not marked offline.

        The legacy door `/api/hive/stats` serves the identical payload.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ts: { type: integer }
                  bees:
                    type: object
                    properties:
                      registered: { type: integer, nullable: true }
                      online: { type: integer, nullable: true }
                      offline: { type: integer, nullable: true }
                      stressed: { type: integer, nullable: true }
                      volunteers: { type: integer, nullable: true }
                      countries: { type: integer, nullable: true }
                      cities: { type: integer, nullable: true }
                      country_list: { type: array, items: { type: string } }
                      city_list: { type: array, items: { type: string } }
                      online_list: { type: array, items: { type: string } }
                  models:
                    type: object
                    properties:
                      total: { type: integer, nullable: true }
                      distinct: { type: integer, nullable: true }
                      providers_active: { type: integer, nullable: true }
                      names: { type: array, items: { type: string } }
                  capacity:
                    type: object
                    properties:
                      total_cpus: { type: integer, nullable: true }
                      total_memory_gb: { type: number, nullable: true }
                      free_memory_gb: { type: number, nullable: true }
                      total_workers: { type: integer, nullable: true }
                      active_jobs: { type: integer }
                      available_capacity: { type: integer, nullable: true }
                      utilization_percent: { type: number, nullable: true }
                  performance:
                    type: object
                    properties:
                      requests_today: { type: integer, nullable: true }
                      tokens_today: { type: integer, nullable: true }
                      top_tps: { type: number, nullable: true }
                      avg_ttfb_ms: { type: integer, nullable: true }
                      total_jobs: { type: integer, nullable: true }
                      success_rate: { type: number, nullable: true }
                      cost_today: { type: number, nullable: true }
                  honey:
                    type: object
                    properties:
                      total: { type: integer, nullable: true }
                      leader: { type: string, nullable: true }
                      leader_honey: { type: integer, nullable: true }
                      leader_rank: { type: string, nullable: true }
                      bees: { type: integer, nullable: true }
                  bridge:
                    type: object
                    properties:
                      peers: { type: integer, nullable: true }
                      allowance_percent: { type: integer, nullable: true }
                      allowance_mode: { type: string, nullable: true }
                  gateway:
                    type: object
                    properties:
                      version: { type: string, nullable: true }
                      uptime_seconds: { type: integer, nullable: true }
                      providers_active: { type: integer, nullable: true }
                      database: { type: string, nullable: true }
                      hub:
                        type: object
                        nullable: true
                        properties:
                          lat: { type: number }
                          lon: { type: number }
                          city: { type: string, nullable: true }
                          country_code: { type: string, nullable: true }

  /api/chat:
    post:
      tags: [Chat]
      summary: Stream a chat reply (SSE)
      description: |
        Smart-default endpoint used by `hivv chat`. Streams SSE chunks.
        Each event is `data: {"delta": "..."}` followed by `data: [DONE]`.
        Auth is optional; logged-in users get their model preferences + history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, description: "The user's prompt." }
                model: { type: string, description: "Optional model override (e.g. gpt-4o, claude-sonnet-4-20250514)." }
                stream: { type: boolean, default: true }
                visitor_id: { type: string, description: "Anonymous visitor id (from /api/visitor/id)." }
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"delta": "Hello"}
                  data: {"delta": "!"}
                  data: [DONE]

  /api/prefs:
    get:
      tags: [Routing]
      summary: Your routing defaults (verified identity required)
      description: |
        K3/K4: stored per-principal defaults. A mode and a privacy value that
        fill in ONLY the fields a request leaves out — an explicit route.mode
        from the caller always wins (a pref is a default, never an override).
        Identity is VERIFIED (signed session · SIGNED hivv_visitor cookie ·
        proven x-node-secret); the spoofable x-visitor-id header is never a
        scope. Returns 403 NO_IDENTITY without one.
      responses:
        '200':
          description: scopes + defaults + self_nodes for the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes: { type: array, items: { type: string }, example: ["visitor:v_ab12…"] }
                  defaults: { type: object, example: { mode: fast, privacy: self } }
                  self_nodes: { type: array, items: { type: string }, description: "Bees you claimed for privacy self." }
        '403':
          description: NO_IDENTITY — no verified scope on this request
    put:
      tags: [Routing]
      summary: Set your routing defaults (mode / privacy / self bees)
      description: |
        All fields optional and nullable. privacy 'self' = the "only when I
        talk" switch: only your own bees (proven node scope or claimed via
        self_nodes) plus the hub's local model may answer you — other bees
        and ALL cloud providers are hard-filtered out. self_nodes REPLACES
        your claim list and must name bees that exist (404 UNKNOWN_NODE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, nullable: true, enum: [balanced, quality, fast, cost, private, trusted] }
                privacy: { type: string, nullable: true, enum: [localhost, hive, self, any] }
                self_nodes: { type: array, items: { type: string }, example: ["ashy"] }
      responses:
        '200':
          description: saved — echoes the stored defaults for this scope
        '400':
          description: nothing to set, or an unknown mode/privacy value
        '403':
          description: NO_IDENTITY — no verified scope on this request
        '404':
          description: UNKNOWN_NODE — a self_nodes entry names no such bee

  /v1/chat/completions:
    post:
      tags: [Chat]
      summary: OpenAI-compatible chat completions
      description: |
        Drop-in replacement for OpenAI's `/v1/chat/completions`. Accepts
        `{model, messages, stream}` and returns either a JSON or SSE response.
        Used by `hivv completions` and any tool that already speaks OpenAI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string, default: hivv, example: hivv }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                stream: { type: boolean, default: false }
                max_tokens: { type: integer }
                temperature: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  object: { type: string, example: chat.completion }
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        message:
                          type: object
                          properties:
                            role: { type: string }
                            content: { type: string }
                        finish_reason: { type: string }

  /bee/v1/{username}:
    get:
      tags: [Bee]
      summary: Chat with a public bee by username (v1 — legacy)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML chat page
          content:
            text/html:
              schema: { type: string }

  /bee/v2/{username}:
    get:
      tags: [Bee]
      summary: Chat with a public bee by username (v2)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML chat page

  /bee/{username}:
    get:
      tags: [Bee]
      summary: Chat with a public bee (current stable)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML chat page

  /api/visitor/id:
    get:
      tags: [Auth]
      summary: Get an anonymous visitor id (for chat history)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  visitor_id: { type: string, example: v_8a3c1f4d2e5b }

  /api/auth/csrf-token:
    get:
      tags: [Auth]
      summary: Fetch a CSRF token (required for POSTs from browser)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: |
        Rate limited to 5/min per IP. Email + password. Returns a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                username: { type: string }
      responses:
        '200':
          description: Account created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      username: { type: string }
        '400': { description: Invalid input }
        '409': { description: Email already registered }
        '429': { description: Rate limited (5/min) }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in (email/username + password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user:
                    type: object
        '401': { description: Wrong credentials }
        '429': { description: Rate limited }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clears session cookie)
      responses:
        '200': { description: OK }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    nullable: true

  /api/nodes/register:
    post:
      tags: [Agents]
      summary: Register a new bee/node (used by `hivv start`)
      description: |
        Body must include a stable `id` or `token`; server derives `node_id`
        from `body.id || body.token`. Phase A also sends `hw_id`,
        `auth_token`, and `capabilities`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, hostname, version]
              properties:
                id: { type: string, description: "Stable per-host id (cli-<hostname>-<hw-id-prefix>)." }
                token: { type: string, description: "Alternative id field; server uses id || token." }
                hostname: { type: string }
                version: { type: string }
                name: { type: string }
                ip: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
                max_concurrent_jobs: { type: integer }
                hw_id: { type: string, description: "linux-<machine-id> / macos-<uuid> / windows-<uuid>" }
                auth_token: { type: string, description: "256-bit bearer token." }
                metrics: { type: object }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
        '400': { description: "Missing id/token" }

  /api/nodes/{node_id}/heartbeat:
    post:
      tags: [Agents]
      summary: Send a heartbeat (every HEARTBEAT_S seconds, default 60)
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                version: { type: string }
                ts: { type: integer, description: "Unix epoch seconds." }
                metrics:
                  type: object
                  description: |
                    `_collect_metrics()` snapshot:
                    `{cpu_count, load_1, load_5, load_15, mem_total_mb,
                    mem_used_mb, mem_pct, disk_total_gb, disk_used_gb,
                    disk_pct, gpus: [{index, name, mem_total_mb,
                    mem_used_mb, util_pct, temp_c}], ts, uptime_s}`
      responses:
        '200': { description: OK }
        '404': { description: "node_id not registered — re-register." }

  /api/agents/{node_id}/inbox:
    get:
      tags: [Inbox]
      summary: Long-poll inbox (Phase A — hub→bee 2-way comms)
      description: |
        Long-poll endpoint. Server holds the request open for up to `wait`
        seconds (capped ~50s). Returns immediately if there are queued
        messages. Returns 200 with `{messages: []}` if nothing.

        Used by `hivv start`'s background agent loop, between heartbeats.

        **Server-side (to be implemented):**
        - verify `Authorization: Bearer`
        - verify HMAC signature with 5-min replay window
        - return queued messages addressed to this `node_id`
        - emit `update_available` when a new client version is published
        - emit `shutdown_requested` for graceful drain
        - emit `job_available` for queued jobs (Phase 2)
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
        - name: wait
          in: query
          schema: { type: integer, default: 50, maximum: 60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: m_abc123 }
                        type:
                          type: string
                          enum: [update_available, shutdown_requested, log, job_available]
                        payload: { type: object }
                        ts: { type: integer }
        '404':
          description: "Hub does not implement inbox (legacy mode — CLI logs 'inbox 404 → heartbeat-only')."
        '401':
          description: "Bad signature / unknown node."

  /api/agents/{node_id}/inbox/ack:
    post:
      tags: [Inbox]
      summary: Ack delivered message ids (prevents redelivery)
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivered:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Acknowledged }

  /api/bridge/load:
    get:
      tags: [Bridge]
      summary: Cheap hive busy-ness glance (open-hives/0.1)
      description: |
        Memory-only: cluster/capacity/relay counters plus a single indexed
        5-minute latency window raced against a 600ms deadline. Peer hives
        poll this every 60s — it must never hang.
      responses:
        '200':
          description: Load snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: open-hives/0.1 }
                  hive: { type: string, example: hivv.org }
                  mode: { type: string, enum: [steady, supervised] }
                  latency_5m:
                    type: object
                    properties:
                      requests: { type: integer }
                      avg_ms: { type: integer }
                      ok_pct: { type: integer }

  /api/bridge/allowance:
    get:
      tags: [Bridge]
      summary: Dynamic per-peer traffic allowance (0-85%)
      description: |
        The authoritative number a guest hive obeys. Tiered on the 5-minute
        window: >10s or <99% success -> 0% (guests back off); 3-10s -> 25% of
        ceiling; 1-3s -> 50%; <=1s -> ceiling (20% steady, 85% supervised).
      parameters:
        - name: peer
          in: query
          required: true
          schema: { type: string, example: kwaai }
      responses:
        '200':
          description: Allowance
          content:
            application/json:
              schema:
                type: object
                properties:
                  percent: { type: integer, minimum: 0, maximum: 85 }
                  reason: { type: string }
                  retry_after_s: { type: integer }

  /api/bridge/peers:
    get:
      tags: [Bridge]
      summary: Verified, hive-scoped peer hives (public listing)
      responses:
        '200':
          description: Peers
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        remote_hive: { type: string, example: kwaai.ai }
                        protocol: { type: string, example: open-hives/0.1 }
                        latency_ms: { type: integer }

  /api/bridge/problems:
    get:
      tags: [Bridge]
      summary: Failed connection attempts — public learning material
      responses:
        '200':
          description: Problems
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        remote_hive: { type: string }
                        why: { type: string }
                        attempts: { type: integer }

  /api/bridge/heartbeat:
    get:
      tags: [Bridge]
      summary: Cross-network heartbeat — the pulse a peer hive polls (30-60s)
      description: |
        Built for cheap polling: a background 5s tick precomputes the snapshot
        (memory counters + one deadline-bounded indexed latency query), so a
        request is microseconds with no DB on the hot path. age_ms > 90000
        means "this peer seems gone" — the failure signal is staleness.
      parameters:
        - name: peer
          in: query
          schema: { type: string, example: kwaai }
      responses:
        '200':
          description: Pulse
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  age_ms: { type: integer, description: freshness of the snapshot; stale > 90000 }
                  beat_ms: { type: integer, example: 5000 }
                  allowance:
                    type: object
                    properties:
                      percent: { type: integer }
                      reason: { type: string }

  /api/bridge/bridges:
    get:
      tags: [Bridge]
      summary: Bridge registry (public sees scope=hive; operator sees all with ?scope=all)
      responses:
        '200': { description: Registry }
    post:
      tags: [Bridge]
      summary: Propose a bridge — always attempted, always recorded
      description: |
        Any node may propose a bridge to any remote hive. The hub verifies the
        remote manifest (tries /.bridge/hivv.json, /.well-known/*, then the
        optional explicit manifest_url), records every attempt, and lists
        verified scope=hive results. scope=local stays private to the requester.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remote]
              properties:
                remote: { type: string, example: kwaai.ai }
                scope: { type: string, enum: [hive, local], default: hive }
                requested_by: { type: string, example: asher-test }
                note: { type: string, description: Reporter's suggestion; relayed back to the remote hive when it publishes a submit endpoint. }
                manifest_url: { type: string, description: Explicit https manifest source for hives whose web host cannot serve /.well-known. }
      responses:
        '201': { description: Verified and listed }
        '200': { description: Attempted and recorded (failure is public, not silent) }
        '400': { description: Bad remote or manifest_url }
  /api/bridge/requests:
    post:
      tags: [Bridge]
      summary: Submit work to this hive (open-hives/0.1 §3)
      description: |
        A peer hive hands us work. The loop shield is enforced here: our own
        name in X-Hive-Path or X-Hive-Origin is a 409 loop_detected, hops > 3 is
        a 409, and a seen X-Hive-Request-Id returns the SAME state without
        ever executing twice.

        At 0% allowance the queue HOLDS the work (202, state=queued, held=true)
        rather than failing it — a busy hive is still a hive you can visit.
      parameters:
        - in: header
          name: X-Hive-Origin
          schema: { type: string }
          description: The hive that started it.
        - in: header
          name: X-Hive-Path
          schema: { type: string }
          description: Every hive already visited, comma separated.
        - in: header
          name: X-Hive-Hops
          schema: { type: integer }
        - in: header
          name: X-Hive-Request-Id
          schema: { type: string }
          description: The dedupe key. Resubmitting returns the same state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: req_01JABC }
                kind: { type: string, default: chat }
                payload: { type: object, description: The work (chat messages, a tool call, …). }
                callback: { type: string, description: Where to POST the signed result. }
                priority: { type: integer, minimum: -100, maximum: 100 }
                not_before: { type: integer, description: Epoch ms; the work waits until then. }
                ttl_s: { type: integer, default: 3600 }
                budget: { type: object, description: '{max_tokens, max_cost_usd, max_duration_ms}' }
      responses:
        '202': { description: Accepted — poll status_url }
        '409': { description: loop_detected }
        '429': { description: rate_limited }
  /api/bridge/requests/{id}:
    get:
      tags: [Bridge]
      summary: Poll one submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 'State: queued | running | done | failed | expired | rejected | canceled' }
        '404': { description: No such request }
  /api/bridge/requests/{id}/cancel:
    post:
      tags: [Bridge]
      summary: Cancel one submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Canceled }
        '404': { description: No such request }
        '409': { description: Already finished }
  /api/bridge/receipts:
    get:
      tags: [Bridge]
      summary: Receipt rollup per peer (public, open-hives/0.1 §7)
      responses:
        '200': { description: 'Peers with calls, tokens, avg latency, failures, last seen' }
    post:
      tags: [Bridge]
      summary: Ingest a batch of receipts from a peer hive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                hive: { type: string, example: kwaai }
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      node: { type: string }
                      model: { type: string }
                      tokens: { type: integer }
                      latency_ms: { type: integer }
                      status: { type: string }
                      cost: { type: number }
                      persona_id: { type: string }
      responses:
        '200': { description: Batch received }
  /api/telemetry/overview:
    get:
      tags: [Telemetry]
      summary: The pulse — aggregates, error taxonomy, SLO table, queue depths
      responses:
        '200': { description: Overview }
  /api/telemetry/errors:
    get:
      tags: [Telemetry]
      summary: The error taxonomy (one stable vocabulary for "what is broken")
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [public, partner, operator], default: operator }
      responses:
        '200': { description: Counts per error class }
        '403': { description: Operator view needs a control token or admin session }
  /api/telemetry/slo:
    get:
      tags: [Telemetry]
      summary: SLO status and error-budget burn rate
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [public, partner, operator], default: operator }
      responses:
        '200': { description: SLO table }
  /api/telemetry/series:
    get:
      tags: [Telemetry]
      summary: The live time-series for one metric
      parameters:
        - in: query
          name: metric
          required: true
          schema: { type: string }
        - in: query
          name: window_ms
          schema: { type: integer, default: 3600000 }
        - in: query
          name: view
          schema: { type: string, enum: [public, partner, operator], default: operator }
      responses:
        '200': { description: 'Points: [{t, v}]' }
  /api/telemetry/traces/{traceId}:
    get:
      tags: [Telemetry]
      summary: One trace as a waterfall (every span with its parent)
      parameters:
        - in: path
          name: traceId
          required: true
          schema: { type: string }
        - in: query
          name: view
          schema: { type: string, enum: [public, partner, operator], default: operator }
      responses:
        '200': { description: Spans, ordered by start time }
        '404': { description: The trace aged out of the ring }
  /api/telemetry/metrics:
    get:
      tags: [Telemetry]
      summary: Prometheus text exposition
      responses:
        '200': { description: 'text/plain; version=0.0.4' }
  /api/a2a:
    post:
      tags: [A2A]
      summary: A2A (Agent2Agent v1.0) JSON-RPC binding
      description: |
        Methods: SendMessage · GetTask · ListTasks · CancelTask · GetAgentCard.
        A2A tasks ARE task-queue tasks. A policy denial answers
        TASK_STATE_REJECTED; a MAYBE verdict answers TASK_STATE_AUTH_REQUIRED
        with the exact command a human should run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string, example: '2.0' }
                id: { type: string }
                method: { type: string, example: SendMessage }
                params: { type: object }
      responses:
        '200': { description: JSON-RPC result or error }
  /api/a2a/agent-card:
    get:
      tags: [A2A]
      summary: The live A2A agent card (the static copy lives at /.well-known/agent-card.json)
      responses:
        '200': { description: Agent card }

  /api/identity:
    get:
      tags: [Identity]
      summary: Every bound bee identity (public keys — no secrets)
      description: |
        Roster of node_id → self-certifying principal (hivv_ + sha256(pubkey)[:32]),
        binding time/method, last verification, rotation count.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  algorithm: { type: string, example: ed25519 }
                  identities:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id: { type: string }
                        principal: { type: string, example: hivv_2f95fba76f73c8560cee108d1e3507af }
                        status: { type: string, example: active }
                        bound_at: { type: integer }
                        last_ok_at: { type: integer }
                        rotations: { type: integer }

  /api/identity/{nodeId}:
    get:
      tags: [Identity]
      summary: One bee's binding, including its public key and rotation history
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The binding record
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  principal: { type: string }
                  public_key: { type: string, description: base64 raw 32-byte Ed25519 key }
                  status: { type: string, example: active }
                  bound_at: { type: integer }
                  history: { type: array, items: { type: object } }
        '404':
          description: "No identity bound yet (status: unbound)"

  /api/identity/hub-key:
    get:
      tags: [Identity]
      summary: The hub's public key for signed route receipts (X-Hivv-Receipt)
      description: |
        Every chat response may carry an `X-Hivv-Receipt` header: base64 of
        {`statement`, `signature`, `public_key`} where the statement is
        `{v, kind: route.receipt, ts, nonce, answered_by, transport,
        [answer_sha256], [duration_ms]}`, signed by this key. Verify by
        POSTing the decoded receipt to /api/identity/verify and checking the
        returned principal equals this one. Non-streaming answers include
        `answer_sha256` — hash the response body you received and match it;
        streaming answers attest attribution only (the body did not exist
        when the header went out).
      responses:
        '200':
          description: The hub key
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { type: string, example: hivv_7d2ecf4c5573cbc987c8f78c638614aa }
                  public_key: { type: string, description: base64 raw 32-byte Ed25519 key }
                  algorithm: { type: string, example: ed25519 }
                  schema: { type: string, example: hivv.identity.route-receipt.v1 }

  /api/identity/verify:
    post:
      tags: [Identity]
      summary: Pure-crypto verification of a signed statement (no side effects)
      description: |
        Checks statement + signature against a presented public key. Verifies the
        signature AND that the claimed principal derives from the key. Never binds,
        never consumes a nonce — safe for third parties.
        CLI: `hivv identity verify <file|->` or a pasted base64 X-Hivv-Receipt.
        Enforcement: with `HIVV_IDENTITY_ENFORCE=1` on the gateway, register AND
        heartbeat require an identity block (403 IDENTITY_REQUIRED); the default
        is advisory (legacy CLIs untouched).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [statement, signature, public_key]
              properties:
                statement: { type: object, description: canonical-JSON statement (v, kind, node_id, ts, nonce, ...) }
                signature: { type: string, description: base64 Ed25519 over canonicalize(statement) }
                public_key: { type: string, description: base64 raw 32-byte key }
                principal: { type: string, description: optional claimed principal to cross-check }
      responses:
        '200':
          description: Signature valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  principal: { type: string }
        '400':
          description: Verification failed (problems[] says why)

  /api/identity/rotate:
    post:
      tags: [Identity]
      summary: Rotate a node's key — the CURRENT key signs its successor (no legacy proof)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [node_id, rotation]
              properties:
                node_id: { type: string }
                rotation:
                  type: object
                  description: "{statement (kind: identity.rotate, new_public_key), signature, public_key}"
      responses:
        '200':
          description: Rotated — new principal bound, old key retained as superseded history
        '400':
          description: Refused (not the current key / stale / replayed)

  /api/identity/receipts:
    post:
      tags: [Identity]
      summary: Submit a signed execution receipt (Phase 3)
      description: |
        The bee's signed testimony that it ran <op> with result <ok> over
        output <sha256>. Verified against the BOUND key, kept in a bounded
        ring (last 32 per node).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [node_id, receipt]
              properties:
                node_id: { type: string }
                receipt: { type: object, description: "{statement (kind: execution.receipt), signature, public_key}" }
      responses:
        '200':
          description: Recorded
        '400':
          description: Refused (wrong signer / duplicate / malformed)

  /api/identity/receipts/{nodeId}:
    get:
      tags: [Identity]
      summary: A node's verified execution receipts (most recent first)
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 32, maximum: 64 }
      responses:
        '200':
          description: The receipt ring

  /api/identity/revoke:
    post:
      tags: [Identity]
      summary: Put a principal on the public CRL (Phase 4)
      description: |
        Two doors: {node_id, revocation} = SELF-revocation proven by the
        bound key's signature; {principal, reason} = operator revocation
        proven by admin authority (localhost or control token).
        A revoked key authenticates NOTHING afterwards; the legitimate bee
        recovers by rotating to a fresh key with legacy proof.
      responses:
        '200':
          description: Revoked
        '400':
          description: Refused
        '403':
          description: Operator revocation without admin authority

  /api/identity/revocations:
    get:
      tags: [Identity]
      summary: The public CRL — who was revoked, by whom, why
      responses:
        '200':
          description: The revocation list

  /api/identity/endorse:
    post:
      tags: [Identity]
      summary: Submit an operator's signed endorsement of a node (Phase 4)
      description: |
        An operator key (never a bee key) signs "node X is mine, role R".
        The hub checks self-consistency (operator_principal derives from the
        signing key) and the node-binding cross-check when known.
      responses:
        '200':
          description: Endorsed (or updated — same operator/node/role dedupes)
        '400':
          description: Refused

  /api/identity/endorsements:
    get:
      tags: [Identity]
      summary: Endorsements (optionally filtered by ?node_id=)
      responses:
        '200':
          description: The endorsement list

  /api/identity/trust/{nodeId}:
    get:
      tags: [Identity]
      summary: MEASURED trust — the blended score the router uses (Phase 5)
      description: |
        Dimensions identity · reliability · history · receipts, each 0..100
        or null (= NO DATA, never zero), plus evidence per dimension and the
        0..6 score the routing trust factor consumes. Reading it upserts
        hivv_trust_scores when a database is present (local-first: skipped).
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The trust breakdown


  /api/proposals:
    post:
      summary: Raise a proposal — one proposed change to the source
      description: >
        A proposal carries a patch and the evidence about it. It only ever
        ADVANCES through the gates (study -> authorize -> test -> approve ->
        merge); the state machine refuses to skip one. A patch is DATA, never
        an instruction. See HIVV_SELF_MODIFICATION_PLAN.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, patch]
              properties:
                repo: { type: string, example: htmlfarmer/hivv }
                patch: { type: string, description: unified diff }
                base_sha: { type: string }
                branch: { type: string }
                title: { type: string }
                summary: { type: string }
                files_changed: { type: array, items: { type: string } }
                baseline_suite_digest:
                  type: string
                  description: sha256 of the test suite AT base_sha — the
                    test gate refuses a run whose suite digest differs
      responses:
        '201':
          description: "The proposal (state: draft)"
        '400':
          description: missing repo or patch
        '429':
          description: rate limit
    get:
      summary: List proposals
      responses:
        '200':
          description: proposals, newest first
  /api/proposals/{id}:
    get:
      summary: One proposal with its gates and receipt chain
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: the proposal
        '404':
          description: no such proposal
  /api/proposals/{id}/verify:
    get:
      summary: Verify the signed receipt chain
      description: >
        Checks every gate receipt signature against the hub key and the chain
        hash over them. A tampered receipt is caught.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: the chain verifies
        '409':
          description: a receipt does not verify
  /api/proposals/{id}/study:
    post:
      summary: "G1 — what does this change do?"
      description: >
        Deterministic findings (hard_danger, secrets, injection) plus model
        votes. hard_danger and secrets block. An injection finding or a RISKY
        vote does NOT block — it sets needs_human, which the approve gate
        requires a signature for.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: study passed
        '409':
          description: the study gate refused it
  /api/proposals/{id}/authorize:
    post:
      summary: "G2 — may this change happen? (policy gate)"
      description: >
        Runs the existing policy gate with capability source.modify (tier
        side-effect, default ask). A MAYBE keeps the proposal alive and
        returns the grant to approve. Fails CLOSED.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: allowed
        '202':
          description: MAYBE — run hivv approve G_xxx
        '409':
          description: denied, or an earlier gate has not passed
  /api/proposals/{id}/test:
    post:
      summary: "G3 — does it work? (the BASELINE suite is authoritative)"
      description: >
        The evidence must carry base_sha matching the proposal and the
        baseline suite digest pinned at intake — a change cannot pass by
        shipping its own weakened tests.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: tests passed
        '409':
          description: refused (wrong suite, failing tests, out of order)
  /api/proposals/{id}/approve:
    post:
      summary: "G4 — do enough independent parties say yes?"
      description: >
        Quorum + distinct model families + no bee holding over half of it +
        the author never approving their own change + a human for a protected
        path or a flagged diff.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: approved
        '403':
          description: the author cannot approve their own proposal
        '409':
          description: quorum / diversity / human requirement not met
  /api/proposals/{id}/merge:
    post:
      summary: "G5 — land it, signed, and undoable"
      description: >
        Operator only. Requires every earlier gate plus a merge sha and a
        rollback artifact that lives outside the changed tree.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: merged
        '403':
          description: merging needs an operator
        '409':
          description: a gate has not passed, or no rollback artifact
  /api/proposals/{id}/reject:
    post:
      summary: Kill a proposal, with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: rejected
        '409':
          description: already finished

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Per-install bearer token from auth.json (created on first CLI run)."
    signedRequest:
      type: apiKey
      in: header
      name: X-Auth-Signature
      description: |
        HMAC-SHA256 over `(timestamp + nonce + method + path + sha256(body))`
        keyed by the bearer token. Required for inbox endpoints.
security:
  - bearerAuth: []
  - signedRequest: []
