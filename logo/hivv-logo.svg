<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HIVV — a distributed AI network">
  <title>HIVV — a distributed AI network</title>
  <defs>
    <!-- honeycomb amber -->
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23d"/>
      <stop offset="55%" stop-color="#ffb31a"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
    <!-- wing glass -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d9f4ff" stop-opacity="0.72"/>
    </linearGradient>
    <!-- deep hive brown for every outline -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1d05"/>
      <stop offset="100%" stop-color="#2b1003"/>
    </linearGradient>
    <!-- soft glow behind the bee -->
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffd23d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd23d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow -->
  <circle cx="256" cy="236" r="230" fill="url(#glow)"/>

  <!-- honeycomb hex cells -->
  <g fill="none" stroke="url(#ink)" stroke-opacity="0.20" stroke-width="5">
    <path d="M256 26 L308 53 L308 108 L256 135 L204 108 L204 53 Z"/>
    <path d="M256 138 L308 165 L308 220 L256 247 L204 220 L204 165 Z"/>
    <path d="M256 250 L308 277 L308 332 L256 359 L204 332 L204 277 Z"/>
    <path d="M381 93 L433 120 L433 175 L381 202 L329 175 L329 120 Z"/>
    <path d="M381 205 L433 232 L433 287 L381 314 L329 287 L329 232 Z"/>
    <path d="M131 93 L183 120 L183 175 L131 202 L79 175 L79 120 Z"/>
    <path d="M131 205 L183 232 L183 287 L131 314 L79 287 L79 232 Z"/>
  </g>

  <!-- stars: the hive is global -->
  <g fill="#4a1d05" fill-opacity="0.55">
    <path d="M96 372 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 Z"/>
    <path d="M406 352 l6 13 14 2 -10 9 3 14 -13 -7 -12 7 2 -14 -10 -9 14 -2 Z"/>
    <path d="M436 246 l5 10 11 2 -8 7 2 11 -10 -5 -10 5 2 -11 -8 -7 11 -2 Z"/>
    <path d="M74 254 l5 10 11 2 -8 7 2 11 -10 -5 -10 5 2 -11 -8 -7 11 -2 Z"/>
    <circle cx="256" cy="72" r="6"/>
  </g>

  <!-- wings (behind the body) -->
  <g stroke="url(#ink)" stroke-width="9" stroke-linejoin="round">
    <path d="M232 196 C182 150 106 146 84 182 C64 214 108 252 214 244 Z" fill="url(#wing)"/>
    <path d="M280 196 C330 150 406 146 428 182 C448 214 404 252 298 244 Z" fill="url(#wing)"/>
  </g>
  <!-- wing veins -->
  <g stroke="url(#ink)" stroke-opacity="0.32" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M222 204 L104 184"/>
    <path d="M222 214 L100 212"/>
    <path d="M222 224 L104 238"/>
    <path d="M290 204 L408 184"/>
    <path d="M290 214 L412 212"/>
    <path d="M290 224 L408 238"/>
  </g>

  <!-- bee body -->
  <ellipse cx="256" cy="282" rx="72" ry="98" fill="url(#honey)" stroke="url(#ink)" stroke-width="10"/>
  <!-- stripes -->
  <g fill="none" stroke="url(#ink)" stroke-width="11" stroke-linecap="round">
    <path d="M191 250 Q256 275 321 250"/>
    <path d="M185 290 Q256 318 327 290"/>
    <path d="M189 330 Q256 358 323 330"/>
  </g>
  <!-- abdomen highlight -->
  <path d="M226 348 Q256 366 286 348" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="256" cy="176" r="62" fill="url(#honey)" stroke="url(#ink)" stroke-width="10"/>
  <!-- antennae -->
  <g fill="none" stroke="url(#ink)" stroke-width="9" stroke-linecap="round">
    <path d="M232 130 C226 100 212 88 192 82"/>
    <path d="M280 130 C286 100 300 88 320 82"/>
  </g>
  <circle cx="190" cy="80" r="11" fill="#4a1d05"/>
  <circle cx="322" cy="80" r="11" fill="#4a1d05"/>

  <!-- eyes -->
  <circle cx="234" cy="172" r="19" fill="#12060a"/>
  <circle cx="278" cy="172" r="19" fill="#12060a"/>
  <circle cx="240" cy="165" r="6" fill="#ffffff"/>
  <circle cx="284" cy="165" r="6" fill="#ffffff"/>

  <!-- smile -->
  <path d="M232 200 Q256 224 280 200" fill="none" stroke="url(#ink)" stroke-width="9" stroke-linecap="round"/>

  <!-- the wordmark: HIVV is pronounced HIVE -->
  <g>
    <rect x="150" y="424" width="212" height="64" rx="16"
          fill="#2b1003" fill-opacity="0.92"/>
    <text x="256" y="468" text-anchor="middle"
          font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace"
          font-size="42" font-weight="700" letter-spacing="9"
          fill="#ffd23d">HIVV</text>
  </g>
</svg>
